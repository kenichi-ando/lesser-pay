<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b6562d" />
  <meta name="description" content="家族で使うかわいい報酬管理アプリ" />
  <title>LesserPay</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LesserPay" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Red panda mascot (reused via SVG symbol) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="lesser-panda" viewBox="0 0 120 120">
        <image href="icons/lesser-panda-face.png" x="0" y="0" width="120" height="120" preserveAspectRatio="xMidYMid slice"/>
      </symbol>

    </defs>
  </svg>

  <div id="user-select-screen" class="user-select-screen hidden">
    <div class="user-select-card">
      <button id="user-select-close-btn" class="user-select-close-btn hidden" type="button" data-i18n-attr-aria-label="userSelect.close">✕</button>
      <svg class="user-select-mascot" width="80" height="80" aria-hidden="true"><use href="#lesser-panda"/></svg>
      <h2 class="user-select-title" data-i18n="userSelect.title">ユーザー選択</h2>
      <p class="user-select-desc" data-i18n="userSelect.desc"></p>
      <div id="user-select-list" class="user-select-list"></div>
    </div>
  </div>

  <header class="app-header">
    <h1 class="app-title">
      <svg class="app-logo" width="36" height="36"><use href="#lesser-panda"/></svg>
      <span class="app-title-text" data-i18n="app.title"></span>
    </h1>
    <div class="header-actions">
      <button id="user-label" class="user-label hidden" type="button" data-i18n-attr-aria-label="header.currentUser"></button>
    </div>

    <div id="user-popover" class="user-popover hidden" role="menu" aria-labelledby="user-label">
      <div class="user-popover-title" data-i18n="users.switcherTitle"></div>
      <ul id="user-popover-list" class="user-popover-list"></ul>
    </div>
  </header>

  <div id="pull-indicator" class="pull-indicator" aria-hidden="true">
    <span class="pull-indicator-icon" aria-hidden="true"></span>
  </div>

  <main class="app-main">
    <section class="balance-card">
      <div class="balance-label" data-i18n="balance.label"></div>
      <div class="balance-value">
        <span class="balance-number">
          <span id="balance-amount">---</span>
          <span class="balance-unit" data-i18n="balance.unit"></span>
        </span>
      </div>
      <div class="balance-actions">
        <button id="bonus-btn" class="balance-bonus hidden" type="button" data-i18n="bonus.button"></button>
        <button id="cashout-btn" class="balance-cashout hidden" type="button" data-i18n="cashout.button"></button>
      </div>
    </section>

    <section class="content-section">
      <div class="tabs" role="tablist">
        <button id="tab-tasks"   class="tab is-active" type="button" role="tab" aria-controls="panel-tasks"   data-tab="tasks">
          <span class="tab-emoji">📋</span><span class="tab-label" data-i18n="tasks.sectionTitle"></span>
          <span id="tab-tasks-badge" class="tab-badge hidden"></span>
        </button>
        <button id="tab-history" class="tab"           type="button" role="tab" aria-controls="panel-history" data-tab="history">
          <span class="tab-emoji">🐾</span><span class="tab-label" data-i18n="history.sectionTitle"></span>
        </button>
      </div>

      <div id="panel-tasks" class="tab-panel" role="tabpanel" aria-labelledby="tab-tasks">
        <div class="tasks-toolbar">
          <button id="task-upsert-open-btn" class="task-upsert-open-btn" type="button"></button>
        </div>
        <div id="tasks-list" class="tasks-list">
          <div class="empty-state is-loading" data-i18n="tasks.loading"></div>
        </div>
      </div>

      <div id="panel-history" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-history">
        <div id="history-list" class="history-list">
          <div class="empty-state is-loading" data-i18n="history.loading"></div>
        </div>
      </div>
    </section>

  </main>

  <dialog id="parent-modal" class="modal hidden" aria-modal="true">
    <div class="modal-content">
      <svg class="modal-mascot" width="64" height="64"><use href="#lesser-panda"/></svg>
      <h3 class="modal-title" data-i18n="parent.title">保護者ログイン</h3>
      <p class="modal-desc" data-i18n="parent.desc"></p>
      <label for="parent-pin" class="sr-only" data-i18n="parent.title">保護者PIN</label>
      <input type="password" id="parent-pin" class="modal-input" inputmode="numeric" autocomplete="off" />
      <div class="modal-actions">
        <button id="parent-cancel-btn" class="btn btn-secondary" data-i18n="parent.cancel"></button>
        <button id="parent-submit-btn" class="btn btn-primary" data-i18n="parent.login"></button>
      </div>
      <div id="parent-error" class="modal-error hidden"></div>
    </div>
  </dialog>

  <dialog id="settings-modal" class="modal hidden" aria-modal="true">
    <div class="modal-content">
      <svg class="modal-mascot" width="64" height="64"><use href="#lesser-panda"/></svg>
      <h3 class="modal-title" data-i18n="settings.title">設定</h3>
      <p class="modal-desc" data-i18n="settings.desc"></p>
      <div class="settings-list">
        <button id="settings-push-row" class="settings-row" type="button">
          <span class="settings-row-label">
            <span class="settings-row-emoji" aria-hidden="true">🔔</span>
            <span class="settings-row-text" data-i18n="settings.notifications"></span>
          </span>
          <span class="settings-toggle" id="settings-push-toggle" role="switch" aria-checked="false"><span class="settings-toggle-thumb"></span></span>
        </button>
        <button id="settings-sound-row" class="settings-row" type="button">
          <span class="settings-row-label">
            <span class="settings-row-emoji" aria-hidden="true">🔊</span>
            <span class="settings-row-text" data-i18n="settings.sound"></span>
          </span>
          <span class="settings-toggle" id="settings-sound-toggle" role="switch" aria-checked="false"><span class="settings-toggle-thumb"></span></span>
        </button>
      </div>
      <div class="modal-actions">
        <button id="settings-close-btn" class="btn btn-primary" data-i18n="settings.close"></button>
      </div>
    </div>
  </dialog>

  <dialog id="cashout-modal" class="modal hidden" aria-modal="true">
    <div class="modal-content">
      <svg class="modal-mascot" width="64" height="64"><use href="#lesser-panda"/></svg>
      <h3 class="modal-title" data-i18n="cashout.title">ポイント消費</h3>
      <p class="modal-desc" data-i18n="cashout.desc"></p>
      <div id="cashout-balance" class="cashout-balance"></div>
      <label for="cashout-amount" class="sr-only" data-i18n="cashout.submit">消費ポイント</label>
      <input type="number" id="cashout-amount" class="modal-input" inputmode="numeric" min="1" placeholder="500" />
      <label for="cashout-memo" class="sr-only" data-i18n="cashout.memoLabel">メモ</label>
      <input type="text" id="cashout-memo" class="modal-input" maxlength="80" data-i18n-attr-placeholder="cashout.memoPlaceholder" autocomplete="off" />
      <div class="modal-actions">
        <button id="cashout-cancel-btn" class="btn btn-secondary" data-i18n="cashout.cancel"></button>
        <button id="cashout-submit-btn" class="btn btn-primary" data-i18n="cashout.submit"></button>
      </div>
      <div id="cashout-error" class="modal-error hidden"></div>
    </div>
  </dialog>

  <dialog id="bonus-modal" class="modal hidden" aria-modal="true">
    <div class="modal-content">
      <svg class="modal-mascot" width="64" height="64"><use href="#lesser-panda"/></svg>
      <h3 class="modal-title" data-i18n="bonus.title">ボーナス付与</h3>
      <p class="modal-desc" data-i18n="bonus.desc"></p>
      <label for="bonus-amount" class="sr-only" data-i18n="bonus.pointsPlaceholder">ポイント</label>
      <input type="number" id="bonus-amount" class="modal-input" inputmode="numeric" min="1" data-i18n-attr-placeholder="bonus.pointsPlaceholder" />
      <label for="bonus-label" class="sr-only" data-i18n="bonus.labelPlaceholder">内容</label>
      <input type="text" id="bonus-label" class="modal-input" maxlength="80" data-i18n-attr-placeholder="bonus.labelPlaceholder" autocomplete="off" />
      <div class="modal-actions">
        <button id="bonus-cancel-btn" class="btn btn-secondary" data-i18n="bonus.cancel"></button>
        <button id="bonus-submit-btn" class="btn btn-primary" data-i18n="bonus.submit"></button>
      </div>
      <div id="bonus-error" class="modal-error hidden"></div>
    </div>
  </dialog>

  <dialog id="task-upsert-modal" class="modal hidden" aria-modal="true">
    <div class="modal-content">
      <svg class="modal-mascot" width="64" height="64"><use href="#lesser-panda"/></svg>
      <h3 id="task-upsert-title" class="modal-title">タスク追加</h3>
      <p id="task-upsert-desc" class="modal-desc"></p>
      <label for="task-category-select" class="sr-only" data-i18n="taskForm.category">分類</label>
      <select id="task-category-select" class="modal-input"></select>
      <label for="task-category-custom" class="sr-only" data-i18n="taskForm.categoryCustomPlaceholder">分類</label>
      <input type="text" id="task-category-custom" class="modal-input hidden" maxlength="40" data-i18n-attr-placeholder="taskForm.categoryCustomPlaceholder" autocomplete="off" />
      <label for="task-title-input" class="sr-only" data-i18n="taskForm.titleLabel">項目名</label>
      <input type="text" id="task-title-input" class="modal-input" maxlength="80" data-i18n-attr-placeholder="taskForm.titlePlaceholder" autocomplete="off" />
      <label for="task-points-input" class="sr-only" data-i18n="taskForm.pointsLabel">完了ポイント</label>
      <input type="number" id="task-points-input" class="modal-input" inputmode="numeric" min="1" data-i18n-attr-placeholder="taskForm.pointsPlaceholder" />
      <label for="task-expiry-input" class="sr-only" data-i18n="taskForm.expiryLabel">期限</label>
      <input type="date" id="task-expiry-input" class="modal-input" data-i18n-attr-placeholder="taskForm.expiryPlaceholder" />
      <div class="modal-actions">
        <button id="task-upsert-delete-btn" class="btn btn-secondary hidden"></button>
        <button id="task-upsert-cancel-btn" class="btn btn-secondary" data-i18n="taskForm.cancel"></button>
        <button id="task-upsert-save-new-btn" class="btn btn-secondary hidden"></button>
        <button id="task-upsert-submit-btn" class="btn btn-primary"></button>
      </div>
      <div id="task-upsert-error" class="modal-error hidden"></div>
    </div>
  </dialog>

  <dialog id="confirm-modal" class="modal hidden" aria-modal="true">
    <div class="modal-content">
      <svg class="modal-mascot" width="64" height="64"><use href="#lesser-panda"/></svg>
      <p id="confirm-message" class="modal-desc"></p>
      <div class="modal-actions">
        <button id="confirm-cancel-btn" class="btn btn-secondary" type="button"></button>
        <button id="confirm-ok-btn" class="btn btn-primary" type="button"></button>
      </div>
    </div>
  </dialog>

  <output id="toast" class="toast hidden" aria-live="polite"></output>

  <script type="module" src="/ts/main.ts"></script>
</body>
</html>
